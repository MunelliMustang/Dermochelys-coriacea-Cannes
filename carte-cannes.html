<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte de Cannes et sa région</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --violet:#6d28d9; --noir:#000; --blanc:#fff; --texte:#17121f; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; font-family:system-ui,sans-serif; color:var(--texte); }
  #app { position:relative; height:100%; height:100dvh; min-height:460px; }
  #map { position:absolute; inset:0; background:#222; }
  #map.outil { cursor:crosshair; }

  .panneau { position:absolute; z-index:1000; top:12px; left:12px; background:var(--blanc); border:2px solid var(--noir);
    border-radius:10px; padding:8px 10px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; max-width:calc(100% - 24px); }
  .groupe { display:flex; align-items:center; gap:6px; }
  .groupe > span, .groupe > label { font-size:13px; font-weight:600; }
  .sep { width:2px; align-self:stretch; background:var(--noir); opacity:.15; }
  .pastille { width:26px; height:26px; border-radius:50%; border:2px solid var(--noir); cursor:pointer; padding:0; flex:none; }
  .pastille[aria-pressed="true"] { outline:3px solid var(--violet); outline-offset:2px; }
  .pastille.violet { background:var(--violet); } .pastille.noir { background:var(--noir); } .pastille.blanc { background:var(--blanc); }
  button.act, select { font:inherit; font-size:13px; padding:5px 10px; border:2px solid var(--noir); background:var(--blanc); border-radius:6px; cursor:pointer; color:var(--noir); }
  button.act:hover { background:#ece6fa; }
  button.act[aria-pressed="true"] { background:var(--violet); color:var(--blanc); border-color:var(--violet); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--violet); outline-offset:2px; }

  .barre { position:absolute; z-index:1000; bottom:24px; left:50%; transform:translateX(-50%); background:var(--noir); color:var(--blanc);
    font-size:13px; padding:8px 14px; border-radius:20px; max-width:92%; text-align:center; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .barre button { font:inherit; font-size:12px; background:var(--blanc); color:var(--noir); border:0; border-radius:12px; padding:3px 10px; cursor:pointer; }

  /* fiche d'une balise */
  .leaflet-popup-content { margin:12px 14px; width:290px !important; }
  .fiche h3 { margin:0 0 6px; font-size:16px; }
  .fiche label { font-size:12px; font-weight:600; display:block; margin-top:8px; }
  .fiche input[type=text], .fiche textarea { width:100%; font:inherit; font-size:13px; padding:5px 7px; border:2px solid var(--noir); border-radius:5px; margin-top:3px; }
  .fiche textarea { resize:vertical; min-height:52px; }
  .fiche .ligne { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .fiche .titre { font-size:13px; font-weight:700; margin:12px 0 4px; padding-top:8px; border-top:2px solid rgba(0,0,0,.12); }
  .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
  .photos .vignette { position:relative; aspect-ratio:1; }
  .photos img { width:100%; height:100%; object-fit:cover; border-radius:5px; border:2px solid var(--noir); cursor:zoom-in; display:block; }
  .photos .retirer { position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; border:0; background:var(--noir); color:#fff; font-size:12px; line-height:20px; padding:0; cursor:pointer; }
  .vide { font-size:12px; color:#666; margin:2px 0; }
  .com { background:#f3effc; border-radius:6px; padding:6px 8px; margin-bottom:5px; font-size:13px; word-wrap:break-word; }
  .com small { display:block; color:#555; font-size:11px; margin-bottom:2px; }
  .com button { float:right; border:0; background:none; cursor:pointer; color:#b00020; font-size:12px; }
  .liste-com { max-height:130px; overflow:auto; }
  .supp { color:#b00020 !important; border-color:#b00020 !important; }

  .pin svg { filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
  .pin .age { position:absolute; left:50%; top:56px; transform:translateX(-50%); white-space:nowrap; font:700 11px/1 system-ui,sans-serif;
    padding:3px 7px; border-radius:10px; border:2px solid #000; }
  .pin .age.vert { background:#1b8f3a; color:#fff; border-color:#fff; }
  .pin .age.jaune { background:#f5c400; color:#000; border-color:#fff; }
  .pin .age.rouge { background:#d32020; color:#fff; border-color:#fff; }
  .pin .age.inconnu { background:#fff; color:#444; border-color:#444; border-style:dashed; }
  .pin .halo { position:absolute; left:50%; top:40px; width:50px; height:14px; transform:translateX(-50%); border-radius:50%; border:4px solid; opacity:.9; }
  .pin .halo.vert { border-color:#1b8f3a; background:rgba(27,143,58,.35); }
  .pin .halo.jaune { border-color:#f5c400; background:rgba(245,196,0,.35); }
  .pin .halo.rouge { border-color:#d32020; background:rgba(211,32,32,.35); }
  .pin .halo.inconnu { border-color:#999; border-style:dashed; background:transparent; }
  .fiche input[type=date] { font:inherit; font-size:13px; padding:4px 6px; border:2px solid var(--noir); border-radius:5px; }
  .pin .num { position:absolute; top:-6px; right:-6px; background:var(--violet); color:#fff; border:2px solid #fff; border-radius:50%;
    width:20px; height:20px; font:700 11px/16px system-ui,sans-serif; text-align:center; }
  .trajet-panel { position:absolute; z-index:1000; top:12px; right:12px; width:270px; max-height:calc(100% - 110px); overflow:auto;
    background:var(--blanc); border:2px solid var(--noir); border-radius:10px; font-size:13px; }
  .t-entete { width:100%; display:flex; justify-content:space-between; align-items:center; font:inherit; font-weight:700; padding:9px 12px;
    background:var(--violet); color:var(--blanc); border:0; cursor:pointer; }
  #tCorps { padding:10px 12px; }
  .t-mode { margin-bottom:8px; }
  .t-liste { list-style:none; margin:0; padding:0; }
  .t-liste li { display:flex; align-items:center; gap:6px; padding:5px 6px; margin-bottom:4px; border:2px solid var(--noir); border-radius:7px; background:var(--blanc); cursor:grab; }
  .t-liste li.glisse { opacity:.4; }
  .t-liste li.cible { border-color:var(--violet); background:#ece6fa; }
  .t-liste .poignee { color:#777; letter-spacing:-2px; user-select:none; }
  .t-liste .rang { background:var(--violet); color:var(--blanc); border-radius:50%; width:20px; height:20px; font-weight:700; font-size:11px; display:grid; place-items:center; flex:none; }
  .t-liste .nom { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini { border:0; background:#eee; border-radius:4px; width:22px; height:22px; cursor:pointer; font-size:11px; padding:0; color:var(--noir); }
  .mini:disabled { opacity:.3; cursor:default; }
  .aide-t { font-size:12px; color:#555; margin:6px 0; }
  .t-actions { display:flex; gap:6px; flex-wrap:wrap; }
  @media (max-width:700px) { .trajet-panel { top:auto; bottom:70px; left:12px; right:12px; width:auto; max-height:42%; } }
  #lightbox { position:fixed; inset:0; z-index:5000; background:rgba(0,0,0,.88); display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  #lightbox img { max-width:94vw; max-height:92vh; border-radius:6px; }
  a.act { font-size:13px; padding:5px 10px; border:2px solid var(--noir); border-radius:6px; color:var(--noir); background:var(--blanc); text-decoration:none; }
  .leaflet-popup-content { width:min(290px, 70vw) !important; max-height:58vh; overflow-y:auto; }
  @media (pointer:coarse) { .leaflet-control-zoom { display:none; } }
  @media (max-width:700px) {
    .panneau { top:8px; left:8px; padding:6px 8px; gap:10px; flex-wrap:nowrap; overflow-x:auto; max-width:calc(100% - 16px); -webkit-overflow-scrolling:touch; }
    .panneau .groupe { flex:none; } .panneau .sep { display:none; }
    button.act, select, a.act { padding:9px 12px; font-size:14px; min-height:40px; white-space:nowrap; }
    .pastille { width:34px; height:34px; }
    .fiche input[type=text], .fiche textarea, .fiche input[type=date] { font-size:16px; }
    .mini { width:34px; height:34px; }
    .barre { bottom:calc(14px + env(safe-area-inset-bottom)); font-size:12px; }
    .trajet-panel { bottom:calc(84px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Carte de la région de Cannes"></div>

  <div class="panneau">
    <div class="groupe">
      <button class="act" id="bBalise" aria-pressed="false">+ Balise</button>
      <button class="act" id="bTrajet" aria-pressed="false">Trajet</button>
    </div>
    <div class="sep"></div>
    <div class="groupe" role="group" aria-label="Couleur des nouvelles balises">
      <span>Couleur</span>
      <button class="pastille violet" data-c="violet" aria-label="Violet" aria-pressed="true"></button>
      <button class="pastille noir" data-c="noir" aria-label="Noir" aria-pressed="false"></button>
      <button class="pastille blanc" data-c="blanc" aria-label="Blanc" aria-pressed="false"></button>
    </div>
    <div class="sep"></div>
    <div class="groupe">
      <label for="fond">Fond</label>
      <select id="fond">
        <option value="photo" selected>Satellite</option>
        <option value="plan">Plan IGN</option>
        <option value="osm">OpenStreetMap</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="groupe">
      <label for="filtreDate">Mise à jour</label>
      <select id="filtreDate">
        <option value="tous">Toutes</option>
        <option value="recent">Récentes (vert)</option>
        <option value="ancien">À vérifier (rouge)</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="groupe">
      <button class="act" id="import">Importer</button>
      <input type="file" id="fichierImport" accept=".geojson,.json,application/geo+json,application/json" hidden>
      <button class="act" id="export">Exporter</button>
      <a class="act" href="agenda.html">Agenda</a>
    </div>
  </div>

  <div class="trajet-panel" id="tPanneau" style="display:none">
    <button type="button" class="t-entete" id="tEntete" aria-expanded="true" aria-controls="tCorps">
      <span id="tTitre">Trajet</span><span id="tChev" aria-hidden="true">▾</span>
    </button>
    <div id="tCorps">
      <div class="groupe t-mode">
        <label for="tMode">Déplacement</label>
        <select id="tMode"><option value="car">Voiture</option><option value="bike">Vélo</option><option value="foot">À pied</option></select>
      </div>
      <ol class="t-liste" id="tListe"></ol>
      <p class="aide-t">Glissez les lignes (ou utilisez ▲ ▼) pour changer l’ordre : l’itinéraire se recalcule automatiquement.</p>
      <div class="t-actions">
        <button type="button" class="act" id="tRecalc">Recalculer</button>
        <button type="button" class="act supp" id="tReset">Réinitialiser le trajet</button>
      </div>
    </div>
  </div>

  <div class="barre" id="barre">Choisissez un outil dans la barre du haut. Cliquez sur une balise pour voir sa fiche.</div>
</div>
<div id="lightbox"><img alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var COULEURS = { violet:'#6d28d9', noir:'#000000', blanc:'#ffffff' };
  var ORDRE = ['violet','noir','blanc'];
  var CLE = 'carte-cannes-balises-v2';
  var CLE_AUTEUR = 'carte-cannes-auteur';
  var courante = 'violet';
  var outil = null;            // null | 'balise' | 'trajet'
  var balises = [];            // {id, lat, lng, couleur, nom, description, photos[], commentaires[]}
  var marqueurs = {};
  var etapes = [];             // ids des balises sélectionnées pour le trajet
  var traceCouches = L.layerGroup();
  var modeTrajet = 'car';

  var CANNES = [43.5528, 7.0174];
  var LIMITES = [[43.38, 6.70], [43.72, 7.35]];

  var map = L.map('map', { center: CANNES, zoom: 13, minZoom: 9, maxZoom: 19, maxBounds: LIMITES, maxBoundsViscosity: 0.8, zoomControl: false });
  traceCouches.addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // ---- Fonds de carte (satellite par défaut)
  var geopf = function (couche, format) {
    return 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=' + couche +
      '&STYLE=normal&FORMAT=' + format + '&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
  };
  var fonds = {
    photo: L.tileLayer(geopf('ORTHOIMAGERY.ORTHOPHOTOS', 'image/jpeg'), { maxZoom: 19, attribution: '© IGN – Géoplateforme' }),
    plan: L.tileLayer(geopf('GEOGRAPHICALGRIDSYSTEMS.PLAN.IGN', 'image/png'), { maxZoom: 19, attribution: '© IGN – Géoplateforme' }),
    osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© contributeurs OpenStreetMap' })
  };
  var fondActif = fonds.photo.addTo(map);
  document.getElementById('fond').addEventListener('change', function (e) {
    map.removeLayer(fondActif); fondActif = fonds[e.target.value].addTo(map);
  });

  // ---- Utilitaires
  function echapper(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sauver() {
    try { localStorage.setItem(CLE, JSON.stringify(balises)); return true; }
    catch (e) { alert("Stockage plein : impossible d'enregistrer. Supprimez des photos."); return false; }
  }
  function charger() {
    try { var d = JSON.parse(localStorage.getItem(CLE) || '[]'); return Array.isArray(d) ? d : []; } catch (e) { return []; }
  }
  function trouver(id) { return balises.filter(function (b) { return b.id === id; })[0]; }
  function message(html, boutons) {
    var barre = document.getElementById('barre');
    barre.innerHTML = '<span>' + html + '</span>';
    (boutons || []).forEach(function (bt) {
      var el = document.createElement('button'); el.textContent = bt.texte; el.addEventListener('click', bt.action); barre.appendChild(el);
    });
  }

  // ---- Date de modification : âge affiché sous la balise
  function aujourdhui() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function ageJours(str) {
    if (!str) return null; var p = str.split('-'); if (p.length !== 3) return null;
    var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((t - new Date(+p[0], +p[1] - 1, +p[2])) / 86400000);
  }
  function ageTexte(j) {
    if (j === null) return '?';
    if (j <= 0) return 'auj.';
    if (j < 14) return j + ' j';
    if (j < 60) return Math.floor(j / 7) + ' sem.';
    if (j < 730) return Math.floor(j / 30.4) + ' mois';
    return Math.floor(j / 365) + ' ans';
  }
  var SEUIL_JAUNE = 7, SEUIL_ROUGE = 15;   // en jours : vert < 7 j, jaune de 7 à 14 j, rouge à partir de 15 j
  function niveauAge(j) { return j === null ? 'inconnu' : j < SEUIL_JAUNE ? 'vert' : j < SEUIL_ROUGE ? 'jaune' : 'rouge'; }
  function haloHtml(str) { return '<span class="halo ' + niveauAge(ageJours(str)) + '"></span>'; }
  function ageHtml(str) {
    var j = ageJours(str);
    return '<span class="age ' + niveauAge(j) + '">' + ageTexte(j) + '</span>';
  }
  function dateFr(str) { return str ? str.split('-').reverse().join('/') : 'date non renseignée'; }
  function appliquerFiltre() {
    var f = document.getElementById('filtreDate').value;
    balises.forEach(function (b) {
      var j = ageJours(b.dateModif), ok = true;
      if (f === 'recent') ok = j !== null && j < SEUIL_JAUNE;
      if (f === 'ancien') ok = j === null || j >= SEUIL_ROUGE;
      if (marqueurs[b.id]) marqueurs[b.id].setOpacity(ok ? 1 : 0.2);
    });
  }

  // ---- Icônes
  var PALETTES = {
    violet: { f:'#6d28d9', o:'#ffffff', d:'#c4b5fd', e:'#ffffff', p:'#1a0b33', h:'#ffffff' },
    noir:   { f:'#000000', o:'#ffffff', d:'#4a4a4a', e:'#ffffff', p:'#000000', h:'#ffffff' },
    blanc:  { f:'#ffffff', o:'#000000', d:'#e6e6e6', e:'#000000', p:'#000000', h:'#ffffff' }
  };
  function tortueSvg(c) {
    var k = PALETTES[c] || PALETTES.violet;
    return '<svg width="42" height="50" viewBox="-42 -96 84 100" xmlns="http://www.w3.org/2000/svg">' +
      '<g fill="' + k.f + '" stroke="' + k.o + '" stroke-width="4" stroke-linejoin="round">' +
        '<ellipse cx="0" cy="-40" rx="40" ry="34"/>' +
        '<ellipse cx="-14" cy="-5" rx="12" ry="7"/><ellipse cx="14" cy="-5" rx="12" ry="7"/>' +
        '<ellipse cx="0" cy="-33" rx="27" ry="25"/>' +
        '<ellipse cx="-31" cy="-34" rx="7" ry="11" transform="rotate(22 -31 -34)"/>' +
        '<ellipse cx="31" cy="-34" rx="7" ry="11" transform="rotate(-22 31 -34)"/>' +
        '<circle cx="0" cy="-67" r="26"/>' +
      '</g>' +
      '<ellipse cx="0" cy="-30" rx="16" ry="16" fill="' + k.d + '"/>' +
      '<path d="M-37 -46C-40 -38 -39 -30 -35 -24M37 -46C40 -38 39 -30 35 -24" fill="none" stroke="' + k.d + '" stroke-width="3" stroke-linecap="round"/>' +
      '<ellipse cx="-10" cy="-67" rx="5.5" ry="6.5" fill="' + k.e + '"/><ellipse cx="10" cy="-67" rx="5.5" ry="6.5" fill="' + k.e + '"/>' +
      '<circle cx="-10" cy="-66" r="3.8" fill="' + k.p + '"/><circle cx="10" cy="-66" r="3.8" fill="' + k.p + '"/>' +
      '<circle cx="-8.4" cy="-68.4" r="1.7" fill="' + k.h + '"/><circle cx="11.6" cy="-68.4" r="1.7" fill="' + k.h + '"/>' +
      '<ellipse cx="-19" cy="-59" rx="5.5" ry="3.3" fill="#f9a8d4" opacity=".9"/><ellipse cx="19" cy="-59" rx="5.5" ry="3.3" fill="#f9a8d4" opacity=".9"/>' +
      '<path d="M-4 -58Q0 -53 4 -58" fill="none" stroke="' + k.e + '" stroke-width="2.4" stroke-linecap="round"/>' +
      '</svg>';
  }
  function icone(couleur, numero, dateModif) {
    var badge = numero ? '<span class="num">' + numero + '</span>' : '';
    return L.divIcon({ html: haloHtml(dateModif) + tortueSvg(couleur) + badge + ageHtml(dateModif), className: 'pin',
      iconSize: [42, 50], iconAnchor: [21, 48], popupAnchor: [0, -50] });
  }
  function majIcone(b) {
    var rang = etapes.indexOf(b.id);
    marqueurs[b.id].setIcon(icone(b.couleur, rang >= 0 ? rang + 1 : 0, b.dateModif));
  }

  // ---- Photos : réduction avant stockage
  function reduirePhoto(fichier, cb) {
    var lecteur = new FileReader();
    lecteur.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 900, r = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  }
  var lb = document.getElementById('lightbox');
  lb.addEventListener('click', function () { lb.style.display = 'none'; });
  function agrandir(src) { lb.querySelector('img').src = src; lb.style.display = 'flex'; }

  // ---- Fiche d'une balise
  function rafraichirFiche(b) { marqueurs[b.id].getPopup().setContent(fiche(b)); }

  function fiche(b) {
    var d = document.createElement('div'); d.className = 'fiche';
    var photos = (b.photos || []).map(function (p, i) {
      return '<div class="vignette"><img src="' + p + '" alt="Photo ' + (i + 1) + ' de ' + echapper(b.nom) + '" data-i="' + i + '">' +
        '<button class="retirer" data-i="' + i + '" aria-label="Retirer la photo">×</button></div>';
    }).join('');
    var coms = (b.commentaires || []).map(function (c, i) {
      return '<div class="com"><button data-i="' + i + '" aria-label="Supprimer le commentaire">Suppr.</button><small>' +
        echapper(c.auteur || 'Anonyme') + ' – ' + echapper(c.date) + '</small>' + echapper(c.texte) + '</div>';
    }).join('');
    var auteur = ''; try { auteur = localStorage.getItem(CLE_AUTEUR) || ''; } catch (e) {}

    d.innerHTML =
      '<label>Nom<input type="text" class="f-nom" maxlength="60" value="' + echapper(b.nom) + '"></label>' +
      '<label>Description<textarea class="f-desc" maxlength="500">' + echapper(b.description) + '</textarea></label>' +
      '<label for="f-date">Dernière modification</label>' +
      '<div class="ligne" style="margin-top:3px"><input type="date" id="f-date" class="f-date" value="' + echapper(b.dateModif) + '">' +
      '<button class="act f-auj" type="button">Aujourd’hui</button></div>' +
      '<div class="ligne"><span style="font-size:12px;font-weight:600">Couleur</span>' +
        ORDRE.map(function (c) { return '<button class="pastille ' + c + '" data-c="' + c + '" aria-label="' + c + '" aria-pressed="' + (b.couleur === c) + '"></button>'; }).join('') +
      '</div>' +
      '<div class="titre">Photos (' + (b.photos || []).length + ')</div>' +
      (photos ? '<div class="photos">' + photos + '</div>' : '<p class="vide">Aucune photo pour l’instant.</p>') +
      '<div class="ligne"><input type="file" class="f-photo" accept="image/*" multiple style="font-size:12px;max-width:100%"></div>' +
      '<div class="titre">Commentaires (' + (b.commentaires || []).length + ')</div>' +
      (coms ? '<div class="liste-com">' + coms + '</div>' : '<p class="vide">Aucun commentaire pour l’instant.</p>') +
      '<label>Votre nom<input type="text" class="f-auteur" maxlength="40" value="' + echapper(auteur) + '"></label>' +
      '<label>Votre commentaire<textarea class="f-com" maxlength="500"></textarea></label>' +
      '<div class="ligne"><button class="act f-publier">Publier</button><button class="act supp f-supp">Supprimer la balise</button></div>';

    d.querySelector('.f-nom').addEventListener('input', function (e) { b.nom = e.target.value; sauver(); });
    d.querySelector('.f-desc').addEventListener('input', function (e) { b.description = e.target.value; sauver(); });
    function changerDate(v) { b.dateModif = v; sauver(); majIcone(b); appliquerFiltre(); }
    d.querySelector('.f-date').addEventListener('change', function (e) { changerDate(e.target.value); });
    d.querySelector('.f-auj').addEventListener('click', function () { var v = aujourdhui(); d.querySelector('.f-date').value = v; changerDate(v); });
    d.querySelectorAll('.ligne .pastille').forEach(function (p) {
      p.addEventListener('click', function () {
        b.couleur = p.dataset.c; majIcone(b); sauver();
        d.querySelectorAll('.ligne .pastille').forEach(function (q) { q.setAttribute('aria-pressed', String(q === p)); });
      });
    });
    d.querySelectorAll('.photos img').forEach(function (im) { im.addEventListener('click', function () { agrandir(b.photos[+im.dataset.i]); }); });
    d.querySelectorAll('.photos .retirer').forEach(function (bt) {
      bt.addEventListener('click', function () { b.photos.splice(+bt.dataset.i, 1); sauver(); rafraichirFiche(b); });
    });
    d.querySelector('.f-photo').addEventListener('change', function (e) {
      var fichiers = Array.prototype.slice.call(e.target.files), restants = fichiers.length;
      if (!restants) return;
      b.photos = b.photos || [];
      fichiers.forEach(function (f) {
        reduirePhoto(f, function (data) {
          b.photos.push(data);
          if (--restants === 0) { if (!sauver()) b.photos.splice(-fichiers.length); rafraichirFiche(b); }
        });
      });
    });
    d.querySelectorAll('.com button').forEach(function (bt) {
      bt.addEventListener('click', function () { b.commentaires.splice(+bt.dataset.i, 1); sauver(); rafraichirFiche(b); });
    });
    d.querySelector('.f-publier').addEventListener('click', function () {
      var texte = d.querySelector('.f-com').value.trim(); if (!texte) return;
      var nom = d.querySelector('.f-auteur').value.trim();
      try { localStorage.setItem(CLE_AUTEUR, nom); } catch (e) {}
      b.commentaires = b.commentaires || [];
      b.commentaires.push({ auteur: nom, texte: texte, date: new Date().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) });
      sauver(); rafraichirFiche(b);
    });
    d.querySelector('.f-supp').addEventListener('click', function () {
      if (!confirm('Supprimer cette balise, ses photos et ses commentaires ?')) return;
      map.removeLayer(marqueurs[b.id]); delete marqueurs[b.id];
      balises = balises.filter(function (x) { return x.id !== b.id; });
      etapes = etapes.filter(function (id) { return id !== b.id; });
      sauver(); majNumeros(); rendreListe(); planifierCalcul();
    });
    return d;
  }

  // ---- Création / affichage des balises
  function ajouter(b) {
    b.photos = b.photos || []; b.commentaires = b.commentaires || []; b.description = b.description || ''; b.dateModif = b.dateModif || '';
    var m = L.marker([b.lat, b.lng], { icon: icone(b.couleur, 0, b.dateModif), title: b.nom || 'Balise' }).addTo(map);
    m.bindPopup(function () { return fiche(b); }, { maxWidth: 320, autoPanPadding: [20, 70] });
    m.bindTooltip(function () { return echapper(b.nom) + '<br>Modifié : ' + dateFr(b.dateModif); }, { direction: 'top', offset: [0, -52] });
    m.on('click', function () {
      if (outil === 'trajet') {
        m.closePopup();
        basculerEtape(b.id);
      }
    });
    m.on('popupopen', function () { if (outil === 'trajet') m.closePopup(); });
    marqueurs[b.id] = m;
  }

  balises = charger();
  balises.forEach(ajouter);
  document.getElementById('filtreDate').addEventListener('change', appliquerFiltre);
  appliquerFiltre();

  // ---- Outils
  var bBalise = document.getElementById('bBalise'), bTrajet = document.getElementById('bTrajet');
  function choisirOutil(nom) {
    outil = (outil === nom) ? null : nom;
    bBalise.setAttribute('aria-pressed', String(outil === 'balise'));
    bTrajet.setAttribute('aria-pressed', String(outil === 'trajet'));
    document.getElementById('map').classList.toggle('outil', outil === 'balise');
    map.closePopup();
    if (outil === 'balise') message('Cliquez sur la carte à l’endroit de la nouvelle balise.', [{ texte: 'Annuler', action: function () { choisirOutil('balise'); } }]);
    else if (outil === 'trajet') { calculerTrajet(); }
    else message('Choisissez un outil dans la barre du haut. Cliquez sur une balise pour voir sa fiche.');
    rendreListe();
  }
  bBalise.addEventListener('click', function () { choisirOutil('balise'); });
  bTrajet.addEventListener('click', function () { choisirOutil('trajet'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { lb.style.display = 'none'; if (outil) choisirOutil(outil); } });

  map.on('click', function (e) {
    if (outil !== 'balise') return;
    var b = { id: 'b' + Date.now() + Math.floor(Math.random() * 1000), lat: e.latlng.lat, lng: e.latlng.lng,
      couleur: courante, nom: 'Nouvelle balise', description: '', dateModif: aujourdhui(), photos: [], commentaires: [] };
    balises.push(b); ajouter(b); sauver(); appliquerFiltre();
    choisirOutil('balise');            // la pose est unique : l’outil se désactive
    marqueurs[b.id].openPopup();
  });

  // ---- Couleur des nouvelles balises
  document.querySelectorAll('.panneau .pastille').forEach(function (p) {
    p.addEventListener('click', function () {
      courante = p.dataset.c;
      document.querySelectorAll('.panneau .pastille').forEach(function (q) { q.setAttribute('aria-pressed', String(q === p)); });
    });
  });

  // ---- Trajet : liste ordonnée, glisser-déposer, recalcul automatique
  var ROUTEURS = { car: 'routed-car', bike: 'routed-bike', foot: 'routed-foot' };
  var jeton = 0, minuteur = null, dernierNb = 0, indexGlisse = null;
  var panneau = document.getElementById('tPanneau'), liste = document.getElementById('tListe');

  function formatDuree(sec) { var m = Math.round(sec / 60); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + ('0' + (m % 60)).slice(-2); }
  function majNumeros() { balises.forEach(function (x) { if (marqueurs[x.id]) majIcone(x); }); }
  function planifierCalcul() { clearTimeout(minuteur); minuteur = setTimeout(calculerTrajet, 450); }
  function changerEtapes() { majNumeros(); rendreListe(); }
  function basculerEtape(id) {
    var i = etapes.indexOf(id);
    if (i >= 0) etapes.splice(i, 1); else etapes.push(id);
    changerEtapes(); planifierCalcul();
  }
  function deplacer(de, vers) {
    if (vers < 0 || vers >= etapes.length || de === vers) return;
    etapes.splice(vers, 0, etapes.splice(de, 1)[0]);
    changerEtapes(); planifierCalcul();
  }
  function effacerTrajet() {
    clearTimeout(minuteur); jeton++; dernierNb = 0;
    etapes = []; traceCouches.clearLayers(); changerEtapes();
    if (outil === 'trajet') message('Cliquez sur au moins 2 balises, dans l’ordre du parcours.');
  }

  function rendreListe() {
    panneau.style.display = (outil === 'trajet' || etapes.length > 0) ? 'block' : 'none';
    document.getElementById('tTitre').textContent = 'Trajet (' + etapes.length + (etapes.length > 1 ? ' étapes)' : ' étape)');
    liste.innerHTML = '';
    if (!etapes.length) {
      var vide = document.createElement('li'); vide.style.cssText = 'border:0;cursor:default;font-size:12px;color:#555';
      vide.textContent = 'Cliquez sur les balises de la carte pour les ajouter.'; liste.appendChild(vide); return;
    }
    etapes.forEach(function (id, i) {
      var b = trouver(id); if (!b) return;
      var li = document.createElement('li'); li.draggable = true;
      li.innerHTML = '<span class="poignee" aria-hidden="true">⋮⋮</span><span class="rang">' + (i + 1) + '</span>' +
        '<span class="nom">' + echapper(b.nom || 'Balise') + '</span>' +
        '<button type="button" class="mini haut" aria-label="Monter"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
        '<button type="button" class="mini bas" aria-label="Descendre"' + (i === etapes.length - 1 ? ' disabled' : '') + '>▼</button>' +
        '<button type="button" class="mini ret" aria-label="Retirer du trajet">×</button>';
      li.querySelector('.haut').addEventListener('click', function () { deplacer(i, i - 1); });
      li.querySelector('.bas').addEventListener('click', function () { deplacer(i, i + 1); });
      li.querySelector('.ret').addEventListener('click', function () { basculerEtape(id); });
      li.addEventListener('dragstart', function (e) {
        indexGlisse = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); li.classList.add('glisse');
      });
      li.addEventListener('dragend', function () { li.classList.remove('glisse'); });
      li.addEventListener('dragover', function (e) { e.preventDefault(); li.classList.add('cible'); });
      li.addEventListener('dragleave', function () { li.classList.remove('cible'); });
      li.addEventListener('drop', function (e) { e.preventDefault(); li.classList.remove('cible'); if (indexGlisse !== null) deplacer(indexGlisse, i); indexGlisse = null; });
      liste.appendChild(li);
    });
  }

  function calculerTrajet() {
    clearTimeout(minuteur);
    traceCouches.clearLayers();
    if (etapes.length < 2) {
      dernierNb = 0;
      if (outil === 'trajet') message(etapes.length === 1 ? '1 balise sélectionnée. Cliquez sur une autre balise.' : 'Cliquez sur au moins 2 balises, dans l’ordre du parcours.');
      return;
    }
    var coords = etapes.map(function (id) { var b = trouver(id); return b.lng + ',' + b.lat; }).join(';');
    var url = 'https://routing.openstreetmap.de/' + ROUTEURS[modeTrajet] + '/route/v1/driving/' + coords + '?overview=full&geometries=geojson';
    var mon = ++jeton;
    message('Calcul du trajet…');
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      if (mon !== jeton) return;
      if (!data.routes || !data.routes.length) { message('Aucun trajet trouvé entre ces points.'); return; }
      var r = data.routes[0];
      var ligne = r.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
      traceCouches.clearLayers();
      L.polyline(ligne, { color: '#fff', weight: 9, opacity: .95 }).addTo(traceCouches);
      L.polyline(ligne, { color: '#6d28d9', weight: 5 }).addTo(traceCouches);
      if (etapes.length !== dernierNb) map.fitBounds(L.latLngBounds(ligne), { padding: [80, 80] });   // pas de saut de vue quand on réordonne
      dernierNb = etapes.length;
      var nom = { car: 'voiture', bike: 'vélo', foot: 'à pied' }[modeTrajet];
      message('<b>' + (r.distance / 1000).toFixed(1).replace('.', ',') + ' km</b> – ' + formatDuree(r.duration) + ' (' + nom + ', ' + etapes.length + ' étapes)');
    }).catch(function () {
      if (mon !== jeton) return;
      message('Le service de calcul d’itinéraire ne répond pas.', [{ texte: 'Réessayer', action: calculerTrajet }]);
    });
  }

  document.getElementById('tMode').addEventListener('change', function (e) { modeTrajet = e.target.value; calculerTrajet(); });
  document.getElementById('tRecalc').addEventListener('click', calculerTrajet);
  document.getElementById('tReset').addEventListener('click', effacerTrajet);
  document.getElementById('tEntete').addEventListener('click', function () {
    var corps = document.getElementById('tCorps'), ouvert = corps.style.display !== 'none';
    corps.style.display = ouvert ? 'none' : 'block';
    this.setAttribute('aria-expanded', String(!ouvert));
    document.getElementById('tChev').textContent = ouvert ? '▸' : '▾';
  });
  rendreListe();

  // ---- Exporter
  document.getElementById('export').addEventListener('click', function () {
    var geo = { type: 'FeatureCollection', features: balises.map(function (b) {
      return { type: 'Feature',
        properties: { id: b.id, nom: b.nom, description: b.description, couleur: b.couleur, dateModif: b.dateModif, photos: b.photos, commentaires: b.commentaires },
        geometry: { type: 'Point', coordinates: [b.lng, b.lat] } };
    }) };
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(geo, null, 2)], { type: 'application/geo+json' }));
    a.download = 'balises-cannes.geojson'; a.click(); URL.revokeObjectURL(a.href);
  });

  // ---- Importer un fichier GeoJSON exporté par la carte
  var champFichier = document.getElementById('fichierImport');
  document.getElementById('import').addEventListener('click', function () { champFichier.click(); });
  champFichier.addEventListener('change', function (e) {
    var f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    var lecteur = new FileReader();
    lecteur.onload = function () {
      var nouvelles = [];
      try {
        var geo = JSON.parse(lecteur.result);
        var feats = (geo && geo.type === 'FeatureCollection' && Array.isArray(geo.features)) ? geo.features : (geo && geo.type === 'Feature' ? [geo] : null);
        if (!feats) throw new Error('format');
        feats.forEach(function (ft, i) {
          if (!ft || !ft.geometry || ft.geometry.type !== 'Point' || !Array.isArray(ft.geometry.coordinates)) return;
          var lng = Number(ft.geometry.coordinates[0]), lat = Number(ft.geometry.coordinates[1]);
          if (!isFinite(lat) || !isFinite(lng)) return;
          var pr = ft.properties || {};
          nouvelles.push({
            id: (typeof pr.id === 'string' && /^[\w-]{1,60}$/.test(pr.id)) ? pr.id : 'b' + Date.now() + '_' + i,
            lat: lat, lng: lng,
            couleur: ORDRE.indexOf(pr.couleur) >= 0 ? pr.couleur : 'violet',
            nom: String(pr.nom || 'Balise importée').slice(0, 60),
            description: String(pr.description || '').slice(0, 500),
            dateModif: /^\d{4}-\d{2}-\d{2}$/.test(pr.dateModif || '') ? pr.dateModif : '',
            photos: (Array.isArray(pr.photos) ? pr.photos : []).filter(function (x) { return typeof x === 'string' && x.indexOf('data:image/') === 0; }),
            commentaires: (Array.isArray(pr.commentaires) ? pr.commentaires : []).filter(function (c) { return c && typeof c.texte === 'string'; })
              .map(function (c) { return { auteur: String(c.auteur || '').slice(0, 40), texte: c.texte.slice(0, 500), date: String(c.date || '') }; })
          });
        });
      } catch (err) { alert('Ce fichier n’est pas un GeoJSON valide.'); return; }
      if (!nouvelles.length) { alert('Aucune balise (point) trouvée dans ce fichier.'); return; }
      var remplace = nouvelles.filter(function (n) { return trouver(n.id); }).length;
      var texte = nouvelles.length + ' balise(s) à importer.' + (remplace ? '\n' + remplace + ' remplaceront des balises déjà présentes (même identifiant).' : '') + '\nContinuer ?';
      if (!confirm(texte)) return;
      nouvelles.forEach(function (n) {
        var ancienne = trouver(n.id);
        if (ancienne) { map.removeLayer(marqueurs[n.id]); delete marqueurs[n.id]; balises = balises.filter(function (x) { return x.id !== n.id; }); }
        balises.push(n); ajouter(n);
      });
      sauver(); appliquerFiltre(); majNumeros(); rendreListe();
      map.fitBounds(L.latLngBounds(nouvelles.map(function (n) { return [n.lat, n.lng]; })), { padding: [80, 80], maxZoom: 16 });
      message(nouvelles.length + ' balise(s) importée(s).');
    };
    lecteur.readAsText(f);
  });
})();
</script>
</body>
</html>
